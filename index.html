<style>
:root{--bg:#FFFFFF;--paper:#FFFFFF;--ink:#111111;--muted:#666666;--line:#E3E3E3;--accent:#C8321E;--daily:#2F4F7A;--econ:#2E7A5B;--bar:#EEEEEE;--soft:#F6F6F6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--paper:#1A1A1A;--ink:#F2F2F2;--muted:#A6A6A6;--line:#333333;--accent:#F06A52;--daily:#8FB0DC;--econ:#79C9A3;--bar:#2A2A2A;--soft:#1E1E1E}}
*{box-sizing:border-box}
:root{--gothic:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--myeongjo:"Nanum Myeongjo","AppleMyungjo","Batang",serif}
button,input,textarea{font-family:inherit}
h1,h2,h3,.mast,.date,.qa h3,.cnt b{font-family:var(--gothic)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--myeongjo);-webkit-tap-highlight-color:transparent}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header.top{margin-top:22px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:20px 0 16px;text-align:center}
:root{--rule:#8C8C8C}
.mast{font-weight:900;font-size:2rem;letter-spacing:-.02em;margin:0;text-decoration:none;display:inline-block}
.mast b{color:var(--accent)}
.mast img{vertical-align:-5px;margin-right:8px}
.mast img.logo{display:block;height:50px;width:auto;margin:0 auto 10px}
@media (min-width:900px){header.top{margin-top:34px;padding:30px 0 22px}.mast img.logo{height:84px;margin-bottom:14px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mast img.logo{filter:invert(1) hue-rotate(180deg)}}
.tag{font-family:var(--myeongjo);font-weight:700;font-size:.95rem;color:#3A3A3A;letter-spacing:-.01em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#CFCFCF}}
@media (min-width:900px){.tag{font-size:1.2rem}}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ink)}
.datebar button{background:none;border:0;color:var(--ink);width:32px;height:30px;font-size:.8rem;cursor:pointer}
.datebar button:disabled{opacity:.3;cursor:default}
.date{font-weight:700;font-size:.86rem;text-align:center;letter-spacing:.01em}
.date .no{color:var(--accent)}
.date .sep{color:var(--muted);font-weight:400;margin:0 8px}
.date .pc{display:none}
@media (min-width:900px){.date{font-size:.92rem}.date .pc{display:inline}}
.date small{display:block;font-family:var(--myeongjo);font-weight:400;font-size:.78rem;color:var(--muted)}
.kicker{display:inline-block;margin:22px 0 8px;font-size:.8rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:3px 10px}
h1.hl{font-size:2.05rem;line-height:1.3;margin:0;padding:24px 0 20px;font-weight:900;letter-spacing:-.025em;word-break:keep-all;text-align:center;border-bottom:1px solid var(--line)}
.lead{padding-top:18px}
.sum{font-size:.93rem;line-height:1.7;margin:0 0 18px;word-break:keep-all;color:var(--sumc)}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sumc:#B3B3B3}}
@media (min-width:900px){
 .wrap{max-width:1180px;padding:0 32px}
 #main.has .cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 44px;align-items:start}
 #main.has .side{border-left:1px solid var(--line);padding-left:44px;padding-top:24px}
 #main.has .side h2.sec{margin-top:0}
 #main.has .side .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 20px}
 .qas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
 .qas .qa{margin:0}
 #main.has .lead{padding-top:24px}
 h1.hl{font-size:2.6rem;line-height:1.25;padding:34px 40px 28px}
 .sum{font-size:1rem;margin-bottom:22px}
 .tail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 44px;align-items:start}
}
.cntbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cnt{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
.cnt b{color:var(--ink);font-size:1.15rem}
.bar{flex:1;height:9px;background:var(--bar);border-radius:99px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--daily)}.bar .e{background:var(--econ)}
.split{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin:8px 0 8px}
.split span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.cntbox{padding:12px 14px 14px}
.cnt .big{font-family:var(--gothic);font-weight:700;color:var(--ink);font-size:.85rem;white-space:nowrap}
.cnt .big b{font-size:1.6rem;line-height:1;letter-spacing:-.03em;margin-right:2px}
.cnt .cl{font-size:.72rem;line-height:1.3;white-space:nowrap}
.grp{margin-top:11px}
.gh{font-family:var(--gothic);font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:5px}
.gh b{color:var(--c);font-size:.86rem}
.grp.d{--c:var(--daily)}.grp.e{--c:var(--econ)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tile{font-family:var(--gothic);font-size:.72rem;text-align:center;padding:5px 3px;border-radius:6px;background:var(--soft);color:var(--muted);border:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on{background:var(--c);color:#fff;border:1px solid var(--c);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile.on{color:#111}}
@media (min-width:900px){.cntbox{padding:14px 16px 16px}.tiles{gap:5px}.tile{font-size:.76rem;padding:6px 3px}}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.74rem;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.d{color:var(--daily)}.chip.e{color:var(--econ)}
h2.sec{font-size:1.15rem;margin:30px 0 12px;font-weight:900;display:flex;align-items:center;gap:8px}
.qa{background:var(--soft);border-radius:14px;padding:14px 16px;margin:10px 0}
.qa h3{font-size:1.02rem;margin:0 0 6px;line-height:1.45;word-break:keep-all}
.qa p{margin:0;line-height:1.8;font-size:.97rem;word-break:keep-all;white-space:pre-line}
.rel{margin-top:10px}
.rel h2.sec{margin-bottom:4px}
.relnote{margin:0 0 12px;font-size:.76rem;color:var(--muted);line-height:1.5;word-break:keep-all}
.qas{border-top:1px solid var(--line);margin-top:28px;padding-top:22px}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:70%;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.card{display:block;text-decoration:none;scroll-snap-align:start;min-width:0}
.card img,.card .noimg{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;border-radius:6px;background:var(--soft);margin-bottom:8px}
.card .noimg{display:grid;place-items:center;font-size:1.6rem}
.card .ct{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--gothic);font-weight:700;font-size:.95rem;line-height:1.45;word-break:keep-all}
.card .cs{display:block;font-size:.76rem;color:var(--muted);margin-top:4px}
.card:hover .ct{text-decoration:underline}
@media (min-width:900px){
 .cards{grid-auto-flow:row;grid-auto-columns:auto;overflow:visible;padding-bottom:0}
 .card .ct{font-size:.9rem}
 #main.has .cols{align-items:stretch}
 #main.has .lead{display:flex;flex-direction:column}
 #main.has .lead .cntbox{margin-top:auto}
}
.share{display:flex;gap:8px;margin:0 0 6px}
.sharebox[hidden]{display:none}
.share button{flex:1;padding:13px;border-radius:12px;border:0;font-family:var(--gothic);font-weight:700;font-size:.95rem;cursor:pointer;background:#FEE500;color:#191600}
.share button.alt{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.88rem;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
.arch{list-style:none;margin:0;padding:0}
.arch li{}
.tail{border-top:1px solid var(--line);margin-top:30px}
.tail h2.sec{margin-top:20px}
.arch a{display:flex;gap:12px;padding:10px 2px;text-decoration:none;font-size:.9rem;line-height:1.45}
.arch a span{flex:none;color:var(--muted);width:62px}
.arch a.on{font-weight:700}
footer{margin:30px 0 40px;font-size:.76rem;color:var(--muted);line-height:1.7;text-align:center}
footer nav{display:flex;gap:12px;justify-content:center;margin-top:6px}
.extra{margin-top:14px;font-size:.7rem;opacity:.45}
.extra a{text-decoration:none}
</style>

<script src="/news/papers.js"></script>
<script>
const $=s=>document.querySelector(s);
const DAILY=new Set(PAPERS.daily), ECON=new Set(PAPERS.econ);
const WD=['일','월','화','수','목','금','토'];
let dates=[], titles={}, cur=null, story=null;
const _sp=new URLSearchParams(location.search), PREVIEW=_sp.get('preview')?_sp.get('d'):null;

function fmt(d){const [y,m,dd]=d.split('-').map(Number);const w=WD[new Date(y,m-1,dd).getDay()];return {long:`${m}월 ${dd}일 ${w}요일`,year:`${y}년`,short:`${m}월 ${dd}일`,dot:`${m}.${dd}`,wd:w}}
function links(s){ return (s.links||(s.link?[s.link]:[])).map(u=>String(u||'').trim()).filter(u=>/^https?:\/\//.test(u)) }
const HOSTS={'chosun.com':'조선일보','joongang.co.kr':'중앙일보','donga.com':'동아일보','hani.co.kr':'한겨레','khan.co.kr':'경향신문','kmib.co.kr':'국민일보','seoul.co.kr':'서울신문','segye.com':'세계일보','hankookilbo.com':'한국일보','dt.co.kr':'디지털타임스','mt.co.kr':'머니투데이','sedaily.com':'서울경제','ajunews.com':'아주경제','edaily.co.kr':'이데일리','etoday.co.kr':'이투데이','etnews.com':'전자신문','fnnews.com':'파이낸셜뉴스','hankyung.com':'한국경제','mk.co.kr':'매일경제','munhwa.com':'문화일보','heraldcorp.com':'헤럴드경제','asiae.co.kr':'아시아경제','yna.co.kr':'연합뉴스','news1.kr':'뉴스1','newsis.com':'뉴시스','nocutnews.co.kr':'노컷뉴스','ohmynews.com':'오마이뉴스','pressian.com':'프레시안','sisain.co.kr':'시사IN','kbs.co.kr':'KBS','imbc.com':'MBC','sbs.co.kr':'SBS','jtbc.co.kr':'JTBC','ytn.co.kr':'YTN','mbn.co.kr':'MBN','ichannela.com':'채널A','tvchosun.com':'TV조선','yonhapnewstv.co.kr':'연합뉴스TV','biz.chosun.com':'조선비즈','joongang.co.kr':'중앙일보','zdnet.co.kr':'지디넷코리아','inews24.com':'아이뉴스24','bloter.net':'블로터','etnews.co.kr':'전자신문','koreaherald.com':'코리아헤럴드','koreatimes.co.kr':'코리아타임스','koreajoongangdaily.joins.com':'코리아중앙데일리','naver.com':'네이버 뉴스','daum.net':'다음 뉴스'};
function host(u){ try{ const h=new URL(u).hostname.replace(/^(www|m|n|news|biz|v)\./,''); const k=Object.keys(HOSTS).find(k=>h===k||h.endsWith('.'+k)); return k?HOSTS[k]:h }catch(e){ return '원문' } }
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function pick(j){ return j.story || (j.stories&&j.stories[0]) || null }

function render(){
  const f=fmt(cur);
  const i=dates.indexOf(cur);
  $('#date').innerHTML=`${f.year} ${f.long}<span class="sep">·</span><span class="no">제 ${dates.length-i}호</span>`;
  $('#prev').disabled = i>=dates.length-1; $('#next').disabled = i<=0;
  if(!story){ $('#main').className=''; $('#main').innerHTML='<div class="empty">이 날은 기록이 없어요.</div>'; $('#shareRow').hidden=true; }
  else{
    const ps=story.papers||[], d=ps.filter(p=>DAILY.has(p)), e=ps.filter(p=>ECON.has(p));
    const qa=(story.explain||[]).filter(x=>x.q||x.a);
    $('#main').className='has';
    $('#main').innerHTML=`<h1 class="hl">${esc(story.title)}</h1><div class="cols"><div class="lead">
      ${story.summary?`<p class="sum">${esc(story.summary)}</p>`:''}
      <div class="cntbox">
        <div class="cnt"><span class="big"><b>${ps.length}</b>/18곳</span><span class="cl">신문 1면에<br>실렸어요</span><div class="bar"><i class="d" style="width:${d.length/18*100}%"></i><i class="e" style="width:${e.length/18*100}%"></i></div></div>
        ${[['d','종합일간지',PAPERS.daily,d.length],['e','경제지',PAPERS.econ,e.length]].map(([k,n,list,c])=>`<div class="grp ${k}"><div class="gh">${n} <b>${c}</b>/9</div><div class="tiles">${list.map(p=>`<span class="tile${ps.includes(p)?' on':''}">${ps.includes(p)?'✓ ':''}${esc(p)}</span>`).join('')}</div></div>`).join('')}
      </div>
      </div>
      ${links(story).length?`<section class="side rel"><h2 class="sec">📰 관련 기사</h2><p class="relnote">제목은 아침 신문 기준이에요. 그 뒤 새 소식은 여기에 담아요.</p><div class="cards">${links(story).slice(0,4).map(u=>{const c=(story.cards||[]).find(c=>c.url===u)||{}; const src=host(u);
          return `<a class="card" href="${esc(u)}" target="_blank" rel="noopener nofollow">${c.image&&/^https:\/\//.test(c.image)?`<img src="${esc(c.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'<span class="noimg">📰</span>'}<span class="ct">${esc(c.title||src+' 기사 보기')}</span><span class="cs">${esc(src)} →</span></a>`}).join('')}</div></section>`:''}
      </div>`;
    $('#shareRow').hidden=false;
    document.title=`${f.short} 신문 1면: ${story.title} · 오늘의 1면`;
  }
  $('#arch').innerHTML=dates.slice(0,30).map(d=>`<li><a href="?d=${d}" data-d="${d}" class="${d===cur?'on':''}"><span>${fmt(d).dot} ${fmt(d).wd}</span>${esc(titles[d]||'')}</a></li>`).join('');
}

async function load(d,push){
  cur=d;
  story=null;
  if(PREVIEW===d){ try{ const dr=localStorage.getItem('draft1:'+d); if(dr){ const s=JSON.parse(dr); s.papers=[...PAPERS.daily,...PAPERS.econ].filter(p=>(s.papers||[]).includes(p)); s.explain=(s.explain||[]).filter(x=>(x.a||'').trim()); story=s; $('#pvBar').hidden=false } }catch(e){} }
  if(!story){ try{ const r=await fetch(`/news/data/${d}.json?nc=${Date.now()}`); story=r.ok?pick(await r.json()):null }catch(e){ story=null } }
  if(push) history.pushState({d},'',`?d=${d}`);
  render();
}

async function init(){
  try{ const j=await (await fetch(`/news/data/index.json?nc=${Date.now()}`)).json(); dates=j.dates||[]; titles=j.titles||{} }catch(e){ dates=[] }
  dates.sort().reverse();
  const q=new URLSearchParams(location.search).get('d');
  if(PREVIEW && !dates.includes(PREVIEW)){ dates.push(PREVIEW); dates.sort().reverse() }
  const d = (q && dates.includes(q)) ? q : dates[0];
  if(!d){ $('#date').textContent='아직 기록이 없어요'; $('#main').innerHTML='<div class="empty">곧 첫 1면이 올라와요.</div>'; return }
  load(d,false);
}

$('#prev').onclick=()=>{const i=dates.indexOf(cur); if(i<dates.length-1) load(dates[i+1],true)};
$('#next').onclick=()=>{const i=dates.indexOf(cur); if(i>0) load(dates[i-1],true)};
$('#arch').addEventListener('click',e=>{const a=e.target.closest('a[data-d]'); if(!a) return; e.preventDefault(); load(a.dataset.d,true); window.scrollTo({top:0,behavior:'smooth'})});
window.onpopstate=()=>{const q=new URLSearchParams(location.search).get('d'); if(q&&dates.includes(q)) load(q,false)};

function shareText(){
  return `📰 ${fmt(cur).short} 신문 1면\n${story.title} (18곳 중 ${(story.papers||[]).length}곳)`;
}
function pageUrl(){return `https://1myeon.kr/?d=${cur}`}
$('#shareBtn').onclick=async()=>{
  const text=shareText(), url=pageUrl();
  try{ gtag('event','news_share',{date:cur}) }catch(e){}
  if(navigator.share){ try{ await navigator.share({title:'오늘의 1면',text,url}); return }catch(e){ if(e.name==='AbortError') return } }
  try{ await navigator.clipboard.writeText(text+'\n\n'+url); toast('복사했어요. 카톡에 붙여넣기 하세요') }catch(e){ toast('복사가 안 돼요') }
};
$('#copyBtn').onclick=async()=>{ try{ await navigator.clipboard.writeText(pageUrl()); toast('링크를 복사했어요') }catch(e){ toast('복사가 안 돼요') } };
init();
</script>
</body>
</html>
